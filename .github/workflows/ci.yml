# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
#
# Jobs provided by sovereign-ci.yml:
#   test: cargo test --lib (self-hosted clean-room)
#   lint: cargo clippy --all-targets -- -D warnings + cargo fmt --check
#   coverage: cargo llvm-cov + codecov upload
#   security: cargo audit (ubuntu-latest, continue-on-error)
#   provenance: SLSA attest-build-provenance
#   gate: aggregates test+lint results
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@main
    with:
      repo: ${{ github.event.repository.name }}
      # Build-performance standard (build-performance.md §7): nextest test
      # runner + sccache compile cache, matching the fleet reference (copia).
      enable_sccache: true
      use_nextest: true
    secrets: inherit

  # Top-level alias so the org ruleset's required literal `gate` context is
  # satisfied on PRs. sovereign-ci only produces `ci / gate`; the org ruleset
  # (Green Main) requires a check named exactly `gate`. Without this, every
  # pepita PR is BLOCKED (the `gate` job lived only in release.yml, which does
  # not run on pull_request). See infra feedback_ci_gate_name.
  gate:
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "ci failed: ${{ needs.ci.result }}"
            exit 1
          fi
          echo "All required jobs passed"

